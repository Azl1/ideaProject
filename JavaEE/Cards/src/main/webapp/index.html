    <thead class="table-dark">

    <th>ID</th>
    <th>Question</th>

<!-- Modal Add New Categories-->
<div class="modal fade" id="modalAddCategories" tabindex="-1" aria-labelledby="addNewCategoriesModalLabel"
     aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addNewCategoriesModalLabel"> Add new categories</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form>
                    <!--<div class="mb-3">
                        <input type="text" class="form-control" id="add_categories_id" aria-describedby="ID">
                        <label for="add_categories_id" class="form-label">Add id category</label>
                    </div>-->
                    <div class="mb-3">
                        <label for="add_categories_name" class="form-label">Name category</label>
                        <input type="text" class="form-control" id="add_categories_name" aria-describedby="Name">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="add_categories_button">Send</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Change Categories-->
<div class="modal fade" id="modalChangeCategories" tabindex="-1" aria-labelledby="changeCategoriesModalLabel"
     aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="changeCategoriesModalLabel">Change categories</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form>
                    <input type="number" id="change_categories_id" hidden>
                    <div class="mb-3">
                        <label for="change_categories_name" class="form-label">Name categories</label>
                        <input type="text" class="form-control" id="change_categories_name"
                               aria-describedby="Name categories">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="change_categories_button">Send</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Add New Cards-->
<div class="modal fade" id="modalAddCards" tabindex="-1" aria-labelledby="addNewCardsModalLabel"
     aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addNewCardsModalLabel"> Add new cards</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="mb-3">
                        <label for="add_cards_question" class="form-label">Name cards question</label>
                        <input type="text" class="form-control" id="add_cards_question" aria-describedby="Question">
                    </div>
                    <div class="mb-3">
                        <label for="add_cards_answer" class="form-label">Add cards answer</label>
                        <input type="text" class="form-control" id="add_cards_answer" aria-describedby="Answer">
                    </div>
                    <div class="model-footer">
                        <button type="button" class="btn btn-primary" id="add_cards_button">Send</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div>
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalAddCards">
        Add new cards
    </button>
</div>

<!-- Modal Change Cards-->
<div class="modal fade" id="modalChangeCards" tabindex="-1" aria-labelledby="changeCardsModalLabel"
     aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="changeCardsModalLabel">Change cards</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form>
                    <input type="number" id="change_cards_id" hidden>
                    <div class="mb-3">
                        <label for="change_cards_question" class="form-label">Question</label>
                        <input type="text" class="form-control" id="change_cards_question"
                               aria-describedby="Question cards">
                    </div>
                    <div class="mb-3">
                        <label for="change_cards_answer" class="form-label">Answer</label>
                        <input type="text" class="form-control" id="change_cards_answer"
                               aria-describedby="Answer cards">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="change_cards_button">Send</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
